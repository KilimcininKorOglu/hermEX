name: hermex

# Single compose file for hermEX. The whole project is in active development, so
# there is ONE environment and ONE MariaDB (db), no profiles: the Go toolchain
# (dev) and the runnable mail server (mta/pop3/imap/webmail) all come up together
# with `docker compose up -d`. Tests use a SEPARATE database (hermex_test) on the
# same db container, created on demand by the test harness, so the suite never
# disturbs the runtime accounts in the 'email' database. Every persistent volume
# is a docker-data/ bind mount; there are no Docker named volumes.
# Every daemon image is the same multi-stage build; only the command differs. The
# build args stamp the source state into the binaries, since the context excludes
# .git and the toolchain's VCS stamping is off, so a running container would
# otherwise carry no marker of what it was built from. The Makefile exports both;
# a bare `docker compose build` leaves them empty and the binaries report
# "unknown" rather than something false.
# Every hermEX daemon carries a memory and CPU ceiling. Each of them parses input
# from a peer it does not trust (an SMTP sender, an IMAP or HTTP client, a remote
# mailbox for fetchmail), so an allocation bug on any one of those paths must cost
# at most that one container, not the host and every service beside it, including
# the database each of them needs to authenticate anyone at all. The ceilings are
# sized well above a normal working set; the ones that stream whole messages (mta,
# imap, webmail2) get the larger share. The third-party images are deliberately
# left alone: clamav in particular holds its whole signature database in memory,
# and guessing a limit for it would break scanning rather than protect anything.
x-hermex-build: &hermex-build
  context: .
  dockerfile: docker/Dockerfile
  args:
    HERMEX_COMMIT: "${HERMEX_COMMIT-}"
    HERMEX_BUILD_TIME: "${HERMEX_BUILD_TIME-}"

services:
  db:
    container_name: hermex-db
    image: mariadb:11
    environment:
      - MARIADB_ROOT_PASSWORD=hermexstack
      - MARIADB_DATABASE=email
    volumes:
      - ./docker-data/db:/var/lib/mysql
    ports:
      # Bound to the loopback address: the database is a development convenience for
      # tools on this machine, not a service for the network. Publishing it on every
      # interface would offer the dev credentials to anything that can reach the host.
      - "127.0.0.1:8142:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Central log store (Slice N). Internal-only: the daemons and the test harness
  # reach it as mongo:27017 on the compose network, so no host port is exposed
  # (the admin panel, not direct access, is how logs are inspected).
  mongo:
    container_name: hermex-mongo
    image: mongo:7
    volumes:
      - ./docker-data/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Antivirus engine (ClamAV clamd + freshclam). Internal-only, like mongo: the
  # mail daemons reach it as clamav:3310 on the compose network with no host port.
  # Nothing depends_on it; the mail path fails open / temp-fails when it is down,
  # so a slow first freshclam download never blocks the stack from coming up.
  clamav:
    container_name: hermex-clamav
    image: clamav/clamav:1.4
    # The official ClamAV image publishes linux/amd64 only; pin the platform so it
    # runs natively on amd64 hosts and under emulation on an arm64 dev machine.
    platform: linux/amd64
    volumes:
      - ./docker-data/clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  # The dev toolchain container deliberately stays root: it is a local build tool
  # with no listening port and no attacker input, and the module cache it writes
  # through is bind-mounted from root-owned directories, so changing its identity
  # would only break the build.
  dev:
    container_name: hermex-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    working_dir: /src
    volumes:
      - .:/src
      - ./docker-data/cache/go-build:/root/.cache/go-build
      - ./docker-data/cache/go-mod:/go/pkg/mod
      # The source tree carries docker-data, so the three things a build tool must
      # never be able to write are re-mounted read-only on top of it: the serving
      # TLS private keys, the database datadir (the only copy of every DKIM
      # signing key), and the config file holding every daemon secret. This
      # container runs project and dependency test code, which is exactly the code
      # that should not be one stray path away from the key material. The mail
      # daemons that only read the same keys already mount them :ro.
      - ./docker-data/mailboxes/tls:/src/docker-data/mailboxes/tls:ro
      - ./docker-data/db:/src/docker-data/db:ro
      - ./docker-data/config.json:/src/docker-data/config.json:ro
    environment:
      - HERMEX_TEST_MYSQL_DSN=root:hermexstack@tcp(db:3306)/hermex_test?charset=utf8mb4
      - HERMEX_TEST_MONGO_URI=mongodb://mongo:27017
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
    command: sleep infinity

  mta:
    container_name: hermex-mta
    # Unprivileged: a parsing bug in this daemon must not land an attacker at
    # uid 0. The id is the invoking user's (the Makefile exports it) so the
    # bind-mounted mail data stays writable; 65532 is the image default.
    user: "${HERMEX_UID:-65532}:${HERMEX_GID:-65532}"
    # Lets the unprivileged process bind its below-1024 port. A capability
    # would not work here: without file capabilities they are dropped on exec
    # for a non-root user. This sysctl is namespaced to this container.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    build: *hermex-build
    command: ["/usr/local/bin/hermex-mta", "-config", "/config/config.json"]
    volumes:
      - ./docker-data/mailboxes:/data/mailboxes
      - ./docker-data/config.json:/config/config.json:ro
      # Persist the log spill across container recreate so an outage+restart loses
      # no buffered events (a fresh sink replays a leftover logspill.jsonl). A
      # per-daemon subdir is required: each daemon writes its own logspill.jsonl, so
      # a shared dir would race on concurrent append and replay-delete.
      - ./docker-data/spill/mta:/data/logspill
    ports:
      - "8140:25"
    depends_on:
      db:
        condition: service_healthy
      # No dependency on mongo: the log sink self-heals (spills to disk and
      # reconnects), so mail must start and serve even if the log store is absent.
    mem_limit: 1g
    cpus: "2.0"
    healthcheck:
      # Distroless: no shell, no curl. The probe binary ships in the same image.
      test: ["CMD", "/usr/local/bin/hermex-healthcheck", "http://127.0.0.1:8090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  pop3:
    container_name: hermex-pop3
    # Unprivileged: a parsing bug in this daemon must not land an attacker at
    # uid 0. The id is the invoking user's (the Makefile exports it) so the
    # bind-mounted mail data stays writable; 65532 is the image default.
    user: "${HERMEX_UID:-65532}:${HERMEX_GID:-65532}"
    # Lets the unprivileged process bind its below-1024 port. A capability
    # would not work here: without file capabilities they are dropped on exec
    # for a non-root user. This sysctl is namespaced to this container.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    build: *hermex-build
    command: ["/usr/local/bin/hermex-pop3", "-config", "/config/config.json"]
    volumes:
      - ./docker-data/mailboxes:/data/mailboxes
      - ./docker-data/config.json:/config/config.json:ro
      - ./docker-data/spill/pop3:/data/logspill
    ports:
      - "8141:110"
    depends_on:
      db:
        condition: service_healthy
      # No dependency on mongo: the log sink self-heals (spills to disk and
      # reconnects), so mail must start and serve even if the log store is absent.
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      # Distroless: no shell, no curl. The probe binary ships in the same image.
      test: ["CMD", "/usr/local/bin/hermex-healthcheck", "http://127.0.0.1:8090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  imap:
    container_name: hermex-imap
    # Unprivileged: a parsing bug in this daemon must not land an attacker at
    # uid 0. The id is the invoking user's (the Makefile exports it) so the
    # bind-mounted mail data stays writable; 65532 is the image default.
    user: "${HERMEX_UID:-65532}:${HERMEX_GID:-65532}"
    # Lets the unprivileged process bind its below-1024 port. A capability
