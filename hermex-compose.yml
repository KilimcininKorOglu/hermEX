      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # webmail2: the React SPA + its /api/v1 JSON API. The built SPA (dist) is
  # bind-mounted and served same-origin with the API. It is the web UI the
  # gateway proxies at the front-door root.
  webmail2:
    container_name: hermex-webmail2
    # Unprivileged: a parsing bug in this daemon must not land an attacker at
    # uid 0. The id is the invoking user's (the Makefile exports it) so the
    # bind-mounted mail data stays writable; 65532 is the image default.
    user: "${HERMEX_UID:-65532}:${HERMEX_GID:-65532}"
    build: *hermex-build
    command: ["/usr/local/bin/hermex-webmail2", "-config", "/config/config.json"]
    volumes:
      - ./docker-data/mailboxes:/data/mailboxes
      - ./docker-data/config.json:/config/config.json:ro
      - ./internal/webmail2/dist:/webmail2-dist:ro
      - ./docker-data/spill/webmail2:/data/logspill
    ports:
      - "127.0.0.1:8150:8080"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g
    cpus: "2.0"
    healthcheck:
