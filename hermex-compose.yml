      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Central push-notification relay. Internal-only like mongo/clamav: the writer
  # daemons publish mailbox-change wakes here and the long-poll consumers subscribe
  # over SSE, so no host port is exposed. A pure in-memory relay, no database, no
  # mailbox store, so it needs only the config (for the listen address, the shared
  # secret, and the TLS cert it terminates with, the same dev cert as the backends).
  # Nothing depends_on it: a down relay drops every consumer back to polling, so it
  # never blocks the stack from serving mail.
  notify:
    container_name: hermex-notify
    # Unprivileged: a parsing bug in this daemon must not land an attacker at
    # uid 0. The id is the invoking user's (the Makefile exports it) so the
    # bind-mounted mail data stays writable; 65532 is the image default.
    user: "${HERMEX_UID:-65532}:${HERMEX_GID:-65532}"
    build: *hermex-build
    command: ["/usr/local/bin/hermex-notify", "-config", "/config/config.json"]
    volumes:
      - ./docker-data/config.json:/config/config.json:ro
      - ./docker-data/mailboxes/tls:/data/mailboxes/tls:ro
      - ./docker-data/spill/notify:/data/logspill
    mem_limit: 256m
    cpus: "1.0"
    healthcheck:
      # Distroless: no shell, no curl. The probe binary ships in the same image.
      test: ["CMD", "/usr/local/bin/hermex-healthcheck", "http://127.0.0.1:8090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Single-FQDN front door: reverse-proxies to the HTTP daemons by path prefix so
  # one host serves autodiscover/EWS/MAPI/RPC/ActiveSync/DAV/webmail. Reads the
  # shared config.json for everything, DSN, TLS cert, logging, the listen address,
  # the backend base URLs, and the acme storage/CA-root wiring (gateway_* and acme_*
  # keys); its DB connection serves only the TLS certificate store. Terminates TLS
  # with the config's tls_cert (the same dev cert as the mail daemons) and forwards
  # to the backends over TLS, skipping verification on the internal hop. The dev
  # config.json points the backends at https:// service names and the acme storage at
  # the writable /data/acme mount; production leaves acme_ca_root empty.
  gateway:
    container_name: hermex-gateway
    # Unprivileged: a parsing bug in this daemon must not land an attacker at
    # uid 0. The id is the invoking user's (the Makefile exports it) so the
    # bind-mounted mail data stays writable; 65532 is the image default.
    user: "${HERMEX_UID:-65532}:${HERMEX_GID:-65532}"
    build: *hermex-build
    command: ["/usr/local/bin/hermex-gateway", "-config", "/config/config.json"]
    volumes:
      - ./docker-data/config.json:/config/config.json:ro
      - ./docker-data/mailboxes/tls:/data/mailboxes/tls:ro
      - ./docker-data/spill/gateway:/data/logspill
      - ./docker-data/gateway-acme:/data/acme
      - ./docker-data/pebble:/pebble:ro
    ports:
      - "8149:8080"
    networks:
      # In acme mode pebble validates TLS-ALPN-01 by connecting to each managed name
      # on the gateway, so the dev test domain resolves to this container.
      default:
        aliases:
          - mail.hermex.test
          - autodiscover.hermex.test
          - autoconfig.hermex.test
    depends_on:
      # The gateway only reads the directory for the optional TLS certificate store
      # and serves the config-file certificate until it is reachable, so it waits for
      # the db container to exist (DSN host resolves) but not for it to be healthy,
      # the front door must not be held hostage to the cert store at boot.
      db:
        condition: service_started
      mapi:
        condition: service_healthy
      ews:
        condition: service_healthy
      activesync:
        condition: service_healthy
      dav:
        condition: service_healthy
      webmail2:
        condition: service_healthy
    mem_limit: 512m
    cpus: "2.0"
    healthcheck:
      # Distroless: no shell, no curl. The probe binary ships in the same image.
      test: ["CMD", "/usr/local/bin/hermex-healthcheck", "http://127.0.0.1:8090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Pebble: a small ACME test CA (https://github.com/letsencrypt/pebble) for
  # exercising acme mode offline, the real Let's Encrypt needs a public :443 and a
  # real domain, which the dev env cannot provide. Internal-only (ACME on :14000,
  # management on :15000); the gateway reaches it as pebble:14000 and validates
  # TLS-ALPN-01 against itself on :8080 (tlsPort in the config). Not part of the mail
  # path, only used when TLS mode is set to acme with the pebble directory URL.
  pebble:
    container_name: hermex-pebble
    image: ghcr.io/letsencrypt/pebble:2.10.1
    command: ["-config", "/test/config/pebble-config.json"]
    environment:
      - PEBBLE_VA_NOSLEEP=1
    volumes:
      - ./docker/pebble/pebble-config.json:/test/config/pebble-config.json:ro
    restart: unless-stopped

  # Fetch-worker: polls configured remote POP3/IMAP accounts and delivers their new
  # mail into local mailboxes. Outbound-only, it binds no port. A single instance must
  # run this loop (two would double-fetch), so it is its own always-on daemon.
  fetchmail:
    container_name: hermex-fetchmail
    # Unprivileged: a parsing bug in this daemon must not land an attacker at
    # uid 0. The id is the invoking user's (the Makefile exports it) so the
    # bind-mounted mail data stays writable; 65532 is the image default.
    user: "${HERMEX_UID:-65532}:${HERMEX_GID:-65532}"
    build: *hermex-build
    command: ["/usr/local/bin/hermex-fetchmail", "-config", "/config/config.json"]
    volumes:
      - ./docker-data/mailboxes:/data/mailboxes
      - ./docker-data/config.json:/config/config.json:ro
      - ./docker-data/spill/fetchmail:/data/logspill
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      # Distroless: no shell, no curl. The probe binary ships in the same image.
      test: ["CMD", "/usr/local/bin/hermex-healthcheck", "http://127.0.0.1:8090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
