version: "2"

# Report everything. The defaults cap a run at 50 issues per linter and 3 per
# distinct message, which silently hides the rest: a run can report "3 issues"
# when thirty remain, and there is no CI here to catch what the cap swallowed.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

# Two directories inside the tree hold code that is not ours and must never be
# linted or reported on: the npm dependency tree under the webmail SPA (which
# ships a stray Go file), and the module cache the dev container bind-mounts.
# Without these, a run reports third-party findings we cannot act on, and the
# module cache breaks package loading outright.
linters:
  settings:
    errcheck:
      # Teardown reached through the standard interfaces. Their error arrives after
      # the outcome is already decided, so there is nothing to do with it and
      # nowhere to return it.
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.DB).Close
        - (*hermex/internal/objectstore.Store).Close
        - (*hermex/internal/publicfolder.Store).Close
  exclusions:
    paths:
      - internal/webmail2/node_modules
      - docker-data
    rules:
      # Deferred teardown, matched on the call itself rather than by listing every
      # receiver type. Close, Rollback and the protocol equivalents run on a path
      # that has already decided the outcome, so there is nothing to do with their
      # error and nowhere to return it: a failed Rollback follows the failed Commit
      # the caller is already reporting, and a failed Close on a read follows data
      # the caller already has. Non-deferred calls to the same methods stay
      # reported, which is where the ones that hid real failures were.
      - linters: [errcheck]
        source: '^\s*defer .*\.(Close|Rollback|Logout|logout|quit)\(\)$'
      # Rows.Close is called in the ordinary non-deferred position too, right after
      # the range that drained it, and its error is the one rows.Err() reports.
      - linters: [errcheck]
        source: '^\s*(rows|prows)\.Close\(\)$'

formatters:
  exclusions:
    paths:
      - internal/webmail2/node_modules
      - docker-data
