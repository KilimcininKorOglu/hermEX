name: CI

# The Go gate shards and the SPA checks block a merge. golangci-lint and the dependency
# audit only report: a lint sweep is its own reviewed commit, and an advisory
# published overnight is not a reason to fail an unrelated change.
#
# Every step goes through the Makefile or the SPA's own npm scripts, the same
# commands a developer runs, so CI and a local run cannot drift apart.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref makes the older run's verdict irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-gate-db:
    name: Go gate (directory, admin, migrate, logging, activesync)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Service containers run with RAM disk (tmpfs) to eliminate disk I/O bottlenecks.
    # Healthcheck intervals are tightened to eliminate idle wait time on startup.
    services:
      db:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: hermexstack
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --tmpfs /data/db
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      HERMEX_TEST_MYSQL_DSN: root:hermexstack@tcp(127.0.0.1:3306)/hermex_test?charset=utf8mb4
      HERMEX_TEST_MONGO_URI: mongodb://127.0.0.1:27017
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: 'blob:none'
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Require openssl
        run: openssl version
      - name: make gate-host SHARD=2
        run: make gate-host SHARD=2

  go-gate-protocols:
    name: Go gate (ews, objectstore)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: 'blob:none'
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Require openssl
        run: openssl version
      - name: make gate-host SHARD=1
        run: make gate-host SHARD=1

  go-gate-services:
    name: Go gate (services, webmail, mail, commands)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: 'blob:none'
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Require openssl
        run: openssl version
      - name: make gate-host SHARD=3
        run: make gate-host SHARD=3

  spa:
    name: Webmail2 SPA (build + lint + typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: internal/webmail2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: 'blob:none'
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: internal/webmail2/package-lock.json
      - name: Cache node_modules
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: internal/webmail2/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('internal/webmail2/package-lock.json') }}
      - name: Build
        run: npm run build
      - name: Lint, Typecheck and Test (parallel)
        run: |
          npm run lint &
          PID_LINT=$!
          npm run typecheck &
          PID_TC=$!
          npm test &
          PID_TEST=$!
          wait $PID_LINT && wait $PID_TC && wait $PID_TEST

  lint:
    name: golangci-lint (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: 'blob:none'
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: make lint
        run: make lint

  audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: 'blob:none'
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: make audit-deps
        run: make -k audit-deps
