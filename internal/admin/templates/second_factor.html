{{define "second_factor.html"}}{{template "head" .}}
<main class="login">
<div class="login-brand">{{template "brand"}}<div><h1>Two-step verification</h1><p class="page-desc">Enter the code from your authenticator app, or one of your recovery codes.</p></div></div>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<form method="post" action="/admin/ui/second-factor">
<input type="hidden" name="_csrf" value="{{.CSRF}}">
<label>Verification code
<input type="text" name="code" autocomplete="one-time-code" required autofocus>
</label>
<button type="submit">Verify</button>
</form>
</main>
{{template "foot" .}}{{end}}
