{{define "login.html"}}{{template "head" .}}
<div class="login-prefs" data-prefs-local>
{{template "lang-select"}}
{{template "theme-toggle"}}
</div>
<main class="login">
<div class="login-brand">{{template "brand"}}<div><h1>{{t "common.appTitle"}}</h1><p class="page-desc">{{t "login.desc"}}</p></div></div>
{{if .Error}}<p class="error">{{t .Error}}</p>{{end}}
<form method="post" action="/admin/ui/login">
<label>{{t "login.email"}}
<input type="email" name="login" autocomplete="username" required autofocus>
</label>
<label>{{t "login.password"}}
<input type="password" name="password" autocomplete="current-password" required>
</label>
<button type="submit">{{t "login.submit"}}</button>
</form>
</main>
{{template "foot" .}}{{end}}
